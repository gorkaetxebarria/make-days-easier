name: Prerelease (non-main branches)

# Alpha builds for pushes to any branch except main. Build runs automatically;
# the publish job waits for approval from the protected "github-packages" Environment.
# Alpha versions are X.Y.(Z+1)-alpha.<run_id>.<run_attempt> and never create tags.

on:
  push:
    branches-ignore: [main]

permissions: {}

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build alpha package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Compute alpha version
        id: version
        run: |
          version="$(scripts/release/next-version.sh alpha "${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Pack global tool
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src/Mde.Tool/Mde.Tool.csproj --configuration Release --output artifacts -p:PackageVersion="$VERSION"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish alpha package (approval required)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: github-packages
    permissions:
      contents: read
      packages: write   # push the .nupkg to GitHub Packages
    env:
      PACKAGE_OWNER: ${{ github.repository_owner }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - name: Publish to GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${PACKAGE_OWNER,,}"
          dotnet nuget push "artifacts/Mde.Tool.${VERSION}.nupkg" \
            --source "https://nuget.pkg.github.com/${owner}/index.json" \
            --api-key "$NUGET_API_KEY"
